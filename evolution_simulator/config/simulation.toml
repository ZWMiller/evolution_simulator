# Evolution Simulator — Simulation Configuration
# ------------------------------------------------
# Copy this file and edit it to configure your run.
# Pass the path to SimulationRunner:
#
#   from pathlib import Path
#   from evolution_simulator.simulation import SimulationRunner
#   runner = SimulationRunner(Path("my_config.toml"))
#   runner.setup()
#   runner.run()

[simulation]

# Total number of weeks to simulate.
weeks = 200

# Optional integer seed for full reproducibility.
# Comment out (or remove) for a random seed each run.
seed = 42

# Bias applied when generating founding genomes toward the habitat's
# characteristic center vector.  0.0 = fully random (no alignment),
# 1.0 = perfectly aligned with the habitat center.
# Initial viability study (481 LHS trials, not extensive): extinction rate was
# ~58% below 0.23 (creatures too misaligned to survive) and dropped to ~0%
# above 0.46; estimated viable range 0.30–0.85.
founding_habitat_bias = 0.55

# Directory where per-run output folders will be created.
# Each run creates a timestamped subfolder:  output_dir/YYYY-MM-DD_HH-MM-SS/
output_dir = "simulation_logs"

# --- Initial population seeding ---
#
# Each habitat is seeded with (initial_species_per_habitat × creatures_per_species)
# total creatures.  Each "species" gets its own random founding genome, and all
# creatures for that species start near that genome (within initial_genome_noise).
#
# Creatures within a species will be genetically similar enough to mate (cosine
# sim well above 0.9).  Cross-species mating is unlikely because independent
# random founding genomes will have near-zero cosine similarity in 500-dim space.
#
# Each species group is seeded with an equal male/female split.

# Number of distinct founding genomes (proto-species) per habitat at startup.
initial_species_per_habitat = 3

# Creatures generated per founding genome.  Half will be female, half male.
creatures_per_species = 10

# Noise (std dev) applied per-locus around the founding genome.
# Keep ≤ 0.1 to ensure intra-species compatibility (cosine sim ≥ 0.9).
# Larger values produce more initial diversity but risk mating failure.
# Initial viability study (481 LHS trials, not extensive): stable outcomes
# rose from ~11% at low noise (0.01–0.05) to ~22% at high noise (0.12–0.15).
initial_genome_noise = 0.12

# Per-link, per-week probability that an open migration route closes
# spontaneously (landslide, flood, lava flow, etc.).
# Drives allopatric speciation by geographically isolating populations.
# Initial viability study (481 LHS trials, not extensive): stable outcomes
# improved from ~16% at low values (0.000–0.003) to ~21% at high values
# (0.007–0.010); estimated viable range 0.006–0.010.
isolation_probability = 0.008

# --- Logging cadence -------------------------------------------------------
# Two independent cadences control how often each kind of data is written to
# the per-week JSON logs.  Raising them is the single biggest speedup for long
# runs — per-week statistics + JSON logging is ~70% of total runtime.
#
# stats_every: how often to compute + write per-SPECIES / per-HABITAT
#   STATISTICS (mean traits, adaptation/food-water probabilities, per-species
#   counts).  This is the EXPENSIVE compute path (~63% of runtime).  It is
#   snapshot data — exactly what you want for tracking adaptation over
#   thousands of generations.
#     1   = every week (full resolution; original behavior)
#     N   = compute + write stats only every Nth week
#     <=0 = never (except week 1 and the final week, which always get a
#           statistics snapshot so runs stay discoverable and have endpoints)
#
# events_every: how often to write INDIVIDUAL EVENTS (every birth, death,
#   mating attempt, migration, speciation event, and isolation for that week).
#   Use this when you want to trace lineages or study individual-level
#   dynamics.  Writing events every week keeps the large per-pairing
#   mating-event lists in every file (the main JSON-serialization cost).
#     1   = every week (full resolution; original behavior)
#     N   = write events only every Nth week
#     <=0 = never (disabled; recommended for long runs)
#
# A week_NNNNN.json is written whenever EITHER cadence fires that week; each
# section is included only when its own cadence fires.  Global and per-habitat
# POPULATION are written in every file regardless of cadence, so the basic
# population/species time series is never gapped.  The COMPLETE speciation
# history is always preserved in summary.json regardless of these settings.
#
# Common recipes:
#   stats_every = 10, events_every = 0    # snapshot every 10 weeks, no events (default)
#   stats_every = 1,  events_every = 1    # full resolution (original behavior; slowest)
#   stats_every = 52, events_every = 0    # ~yearly species snapshots, no events
#   stats_every = 52, events_every = 1    # cheap stats, full individual events
#   stats_every = 1,  events_every = 52   # full stats, sparse event sampling
#
# To enable detailed per-event logging, set events_every = 1 (or any N > 0).
stats_every = 10
events_every = 0

# respeciate_every: how often (in weeks) to refresh each species' LIVING
# compatibility centroid — the reproductive reference point speciation is
# measured against.  Between refreshes the centroid lags slightly behind the
# population, which is intentional: it gives a genuinely diverging sub-cluster a
# window to pull away before the centroid chases it.  Smaller = the reference
# tracks drift more tightly (harder to speciate); larger = looser tracking.
respeciate_every = 10


[species]

# Speciation is detected on the SAME signal that gates mating: the 245-locus
# compatibility-gene subset (Creature.compatibility_genes).  A newborn's
# compatibility sub-vector is compared by cosine similarity to the LIVING
# centroid of every species that currently has members; it joins the nearest
# one if the score meets this threshold, otherwise it enters the candidate
# stage below.  Because the reference is the living population (refreshed every
# respeciate_every weeks), a whole population drifting together never speciates
# — only a sub-cluster that diverges in the compatibility subset far enough to
# stop interbreeding does (the Biological Species Concept).
#
# Set a touch below the mating floor (Creature.COMPATIBILITY_FLOOR = 0.70) so a
# species boundary means "can no longer breed with that population".  LOWER =
# wider species (more lumping); HIGHER = finer splits.
compatibility_threshold = 0.65

# Two-stage speciation gate — prevents single-birth divergences from inflating
# the species count.
#
# When a newborn's compatibility falls below compatibility_threshold for ALL
# living species, it enters a "candidate" stage instead of immediately creating
# a new species.  The
# creature keeps its parent's species label throughout.  A candidate is promoted
# to a confirmed species only when BOTH conditions are met:
#
#   min_species_population : at least this many living creatures belong to the
#     candidate cluster at the time of the promotion check.  Prevents a lone
#     outlier genome from spawning a species that never reproduces.
#
#   min_species_weeks : the candidate must have existed for at least this many
#     weeks before it can be promoted.  Prevents a single generation of
#     ephemeral mutants from becoming a permanent species.
#
# Candidates whose members all die before meeting these criteria are silently
# evaporated — no speciation event is logged.
#
# Setting both to 1 approximates original (immediate) speciation behaviour.
# Tuned for the generational timescale: a generation is ~25-35 weeks, so these
# require a divergence to persist for a couple of generations as a real
# sub-population before it is named a species (rather than a few individuals over
# a few weeks).  Speciation is therefore rare and mainly legible in long runs.
min_species_population = 10
min_species_weeks = 60

# Sub-cluster split detection (cladogenesis).  Every refresh, each species'
# members are clustered in compatibility space; if they fall into 2+ groups that
# can no longer interbreed, the group nearest the founding type keeps the name
# and the others split off.  This catches divergence a single species centroid
# would mask (e.g. one species adapting separately in two disconnected habitats:
# their shared centroid sits at the midpoint and hides the split until they are
# nearly anti-aligned — clustering the members detects it at the moment they stop
# interbreeding instead).
#   split_max_k                : max sub-clusters considered per species (1..K).
#   split_isolation_threshold  : two sub-clusters are "different species" when
#     their centroid cosine is below this.  Defaults to the mating floor (0.70)
#     so a split coincides with actual reproductive isolation.
split_max_k = 5
split_isolation_threshold = 0.70

# Anagenesis detection (in-place lineage transformation, no split).  A lineage
# can stay one interbreeding population yet drift far from its ancestral form
# over time (think dogs from wolves).  When a species' living PHENOTYPE centroid
# falls below this cosine to its frozen founding phenotype, a descendant species
# is minted and living members are re-sorted to whichever (ancestor vs descendant)
# they now resemble.  Lower = lineages must change more before being renamed.
# Measured drift plateaus near ~0.93 for the most-transformed lineages, so this
# fires only for genuine in-place transformation.  anagenesis_weeks requires that
# transformation to persist (a transient dip that rebounds is not named).
anagenesis_threshold = 0.93
anagenesis_weeks = 60


# ---------------------------------------------------------------------------
# Habitats
# ---------------------------------------------------------------------------
# Define the habitat instances and how they connect.
#
# Available types (each has a distinct characteristic center vector):
#   Desert, Forest, Rainforest, Plains, Tundra, Ocean, CoralReef,
#   Wetlands, Alpine, Volcanic, Cave, Arctic, River, Savanna
#
# Each instance:
#   id   – unique string used in logs and connections (required)
#   type – one of the types above (required)
#   seed – integer controlling per-instance variation around the type center (required)
#   name – human-readable label (optional, defaults to type name)
#
# Per-habitat overrides (optional — omit to use the global values above):
#   initial_species_per_habitat  – founding genomes for this habitat only
#   creatures_per_species        – creatures per founding genome for this habitat only
#
# Example — single-species isolation experiment:
#   initial_species_per_habitat = 1
#   creatures_per_species = 50   # 25 male + 25 female, all near one founding genome

[habitats]

# Pairs of habitat ids connected by migration routes at startup.
# Routes may close spontaneously during the run (see isolation_probability).
connections = [
    ["desert_1", "plains_1"],
    ["plains_1", "forest_1"],
    ["forest_1", "wetlands_1"],
]

[[habitats.instances]]
id   = "desert_1"
type = "Desert"
seed = 1
name = "Northern Desert"

[[habitats.instances]]
id   = "plains_1"
type = "Plains"
seed = 2
name = "Central Plains"

[[habitats.instances]]
id   = "forest_1"
type = "Forest"
seed = 3
name = "Eastern Forest"

[[habitats.instances]]
id   = "wetlands_1"
type = "Wetlands"
seed = 4
name = "Southern Wetlands"
# initial_species_per_habitat = 1  # uncomment to override the global default
# creatures_per_species = 50       # total creatures = initial_species × creatures_per_species

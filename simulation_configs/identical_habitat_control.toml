# identical_habitat_control.toml
#
# Control experiment: five isolated habitats that are IDENTICAL in environment
# (same type, same instance seed → same 500-dim habitat vector).  All five are
# also seeded with the same three founding genomes (mirror mode), matching the
# parallel_divergence run exactly except for the habitat vectors.
#
# Founding genomes are pure random (mirror mode ignores habitat_bias) and are
# determined solely by seed=7 + initial_species_per_habitat=3 — identical to
# the parallel_divergence run so the two experiments start from the same genes.
#
# Hypothesis: with no differential selection pressure (all five habitats select
# for the same trait alignment), we expect far less cladogenesis and much less
# trait divergence between lineages than in the divergence run.  Any speciation
# that does occur is pure genetic drift, not local adaptation.
#
# Compare against parallel_divergence run (simulation_logs/2026-05-25_16-09-11/)
# which used five different biome types under otherwise identical conditions.
#
# Forest is chosen as the biome because it uses Habitat resource defaults —
# the most neutral selection pressure available.  All five instances share
# seed=1 so their per-instance noise is identical, giving truly equal vectors.
#
# 30 000 weeks ≈ 750–1 200 generations (generation ~25–40 weeks).
# Logging every 50 weeks → 600 stat snapshots; events disabled for speed.
# Respeciation checks every 10 weeks (more frequent than log cadence).

[simulation]
weeks                       = 30000
seed                        = 7
output_dir                  = "simulation_logs"

mirror_founding_population  = true   # all habitats start from the same 3 founding genomes
initial_species_per_habitat = 3
creatures_per_species       = 60     # 30 female + 30 male per species per habitat
initial_genome_noise        = 0.05
founding_habitat_bias       = 0.0    # ignored in mirror mode; explicit for clarity

isolation_probability       = 0.0    # no connections → no migration, no route isolation

stats_every                 = 50     # one snapshot per 50 weeks (~600 total)
events_every                = 0      # disable per-event logs for speed
respeciate_every            = 10     # refresh centroids + run detectors every 10 weeks

[species]
compatibility_threshold     = 0.65
min_species_population      = 10
min_species_weeks           = 60     # ~2 generations
split_max_k                 = 5
split_isolation_threshold   = 0.75
anagenesis_threshold        = 0.93
anagenesis_weeks            = 60

[habitats]
connections = []

# All five habitats share type=Forest and seed=1 → identical CENTER vector
# (same TYPE_SEED=1002) and identical per-instance Gaussian noise (same
# instance_seed=1) → truly identical 500-dim environment vectors.

[[habitats.instances]]
id   = "forest_1"
type = "Forest"
seed = 1
name = "Forest_A"

[[habitats.instances]]
id   = "forest_2"
type = "Forest"
seed = 1
name = "Forest_B"

[[habitats.instances]]
id   = "forest_3"
type = "Forest"
seed = 1
name = "Forest_C"

[[habitats.instances]]
id   = "forest_4"
type = "Forest"
seed = 1
name = "Forest_D"

[[habitats.instances]]
id   = "forest_5"
type = "Forest"
seed = 1
name = "Forest_E"
